spring:
  application:
    name: eventix

  datasource:
    url: jdbc:postgresql://localhost:5432/eventix
    username: ${DB_USERNAME:eventix}
    password: ${DB_PASSWORD:eventix}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always